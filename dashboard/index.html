<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공시 비교 대시보드</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f1e1c;--ink2:#5c5a55;--ink3:#8a877f;--line:#e3e0d8;--line2:#cfcbc0;--mark:#2f6fb5;--new:#eaf2fb;--newink:#1d4f86;--sel:#f0eee8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#242321;--ink:#eceae4;--ink2:#b3b0a7;--ink3:#86837b;--line:#35332f;--line2:#4a4843;--mark:#7fb2ea;--new:#1f2f42;--newink:#a9cdf3;--sel:#2d2b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
main{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:15px;font-weight:600;margin:32px 0 10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:16px}
.top label{font-size:13px;color:var(--ink2)}
select{font:inherit;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink)}
.muted{color:var(--ink3);font-size:12px}
.news{display:flex;flex-wrap:wrap;gap:8px}
.news a{display:block;text-decoration:none;color:var(--ink2);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.news a.fresh{background:var(--new);border-color:transparent;color:var(--newink)}
.news b{font-weight:600;color:inherit}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{font-weight:400;font-size:12px;color:var(--ink2);background:var(--card)}
thead th b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
th.m{width:150px;font-weight:400;color:var(--ink2);font-size:13px}
td.c{cursor:pointer}
td.c:hover,td.c.on{background:var(--sel)}
td.c:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
td.sup,th.sup{border-left:2px solid var(--line2)}
.v{font-size:17px;font-weight:600;white-space:nowrap}
.d{font-size:12px;color:var(--ink2);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--new);color:var(--newink);margin-left:6px;vertical-align:2px;font-weight:400}
.none{color:var(--ink3);font-size:13px}
svg.sp{display:block;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:15px;margin:0 0 4px}
.panel p{margin:4px 0;font-size:13px;color:var(--ink2)}
.panel table{min-width:0;margin-top:10px;font-size:13px}
.panel th{font-weight:400;color:var(--ink2);font-size:12px}
.panel td{vertical-align:top}
.q{border-left:2px solid var(--line2);padding-left:10px;color:var(--ink2);font-size:13px;margin:4px 0}
a{color:var(--mark)}
.rel{display:grid;gap:8px}
.rel>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
footer{margin-top:32px;font-size:12px;color:var(--ink3)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tabs button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink2);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--sel);color:var(--ink);border-color:var(--ink3)}
.qa{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.qa b{font-weight:600;display:block;margin-bottom:2px}
.qa svg{display:block;max-width:100%;height:auto;margin-top:6px}
.st{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line2);color:var(--ink3);margin-left:6px;vertical-align:1px;font-weight:400;white-space:nowrap}
.st.done{border-color:transparent;background:var(--sel);color:var(--ink2)}
.st.hot{border-color:var(--ink2);color:var(--ink);font-weight:600}
.th table{min-width:680px;font-size:13px}
.th .st{margin-left:0}
.th h3 .st{margin-left:6px}
.al{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px}
.al h3{font-size:15px;margin:0 0 4px}
.al .row{font-size:13px;color:var(--ink2);margin:4px 0}
.al ul{margin:4px 0;padding-left:20px;font-size:13px;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button.b{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button.b:disabled{color:var(--ink3);cursor:not-allowed}
button.b.sm{font-size:12px;padding:1px 8px;margin-top:4px}
form.f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
form.f input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--ink)}
form.f input[name=note]{flex:1 1 220px}
.err{font-size:12px;color:var(--ink);font-weight:600}
.off{font-size:13px;color:var(--ink2);background:var(--sel);border-radius:8px;padding:8px 12px;margin:8px 0}
details>summary{cursor:pointer;font-size:14px;color:var(--ink2);margin:16px 0 8px}
.log td{font-size:13px}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>공시 비교 대시보드</h1>
  <label>기준 회사 <select id="focal"></select></label>
  <span class="muted" id="gen"></span>
</div>
<div class="tabs" id="tabs"></div>
<div id="fixed">
<h2>최근 반영된 공시</h2>
<div class="news" id="news"></div>
<h2>지표 비교 <span class="muted">칸을 누르면 근거가 나옵니다. 회사마다 회계 분기가 달라 기간을 함께 적습니다. 값이 없는 칸에는 이유를 적습니다: 아직 안 읽음(원문에서 찾아보지 않음), 공시에 없음(찾아봤지만 회사가 밝히지 않음), 해당 없음(이 회사에 맞지 않거나 계산할 수 없음).</span></h2>
<div class="wrap"><table id="grid"></table></div>
<h2>근거</h2>
<div class="panel" id="panel"><p>표의 칸을 누르면 그 값의 정의, 분기별 값, 근거 공시가 여기에 나옵니다.</p></div>
<h2>관계</h2>
<div class="rel" id="rel"></div>
</div>
<div id="theses" hidden></div>
<div id="alerts" hidden></div>
<div id="log" hidden></div>
<div id="view" hidden></div>
<footer>공개된 공시 정보를 정리한 화면입니다. 종목을 추천하거나 투자 판단을 대신하지 않습니다.</footer>
</main>
<script src="data.js"></script>
<script>
const ROLE = {gpu_cloud: "GPU 클라우드", gpu_supplier: "GPU 공급사"};
const FRESH_DAYS = 14;
const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
let D, C, M, genDate;
function loadData() {
  D = window.DATA;
  D.alerts = D.alerts || []; D.actions = D.actions || []; D.theses = D.theses || []; D.gaps = D.gaps || {};
  C = byId(D.companies); M = byId(D.metrics);
  genDate = new Date(D.generated.slice(0, 10));
}
loadData();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const daysAgo = (iso) => Math.round((genDate - new Date(iso)) / 864e5);
const cname = (id) => C[id]?.name || id;
let API = false;
const OFF_MSG = "행동을 기록하려면 python scripts/serve.py로 여세요.";
const ST = {unreviewed: ["검토 전", ""], inputs_unreviewed: ["재료 값 검토 전", ""], reviewed: ["검토함", "done"], corrected: ["정정됨", "done"]};
function stTag(v) {
  const s = ST[v?.review?.status];
  if (!s) return "";
  const why = v.review.status === "corrected" ? ` title="원래 값 ${esc(fmt(v.review.original_value, v.unit))} · ${esc(v.review.note)}"` : "";
  return `<span class="st ${s[1]}"${why}>${s[0]}</span>`;
}

function series(cid, mid) {
  return D.values.filter(v => v.company === cid && v.metric === mid).sort((a, b) => a.period_end < b.period_end ? -1 : 1);
}
function latestPeriod(cid) {
  const r = series(cid, "revenue");
  return r.length ? r[r.length - 1] : null;
}
function latestFiling(cid) {
  let best = null;
  for (const v of D.values) if (v.company === cid) for (const f of v.source.filings || []) if (!best || f.filed > best.filed) best = f;
  return best;
}
function fmt(v, unit) {
  if (unit === "USD") {
    const x = v / 1e8, a = Math.abs(x);
    const digits = a >= 100 ? 0 : a >= 10 ? 1 : 2;
    return x.toLocaleString("ko-KR", {minimumFractionDigits: digits, maximumFractionDigits: digits}) + "억 달러";
  }
  if (unit === "%") return v.toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "%";
  if (unit === "MW") return Math.round(v).toLocaleString("ko-KR") + " MW";
  if (unit === "x") return v.toLocaleString("ko-KR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + "배";
  return String(v);
}
function delta(cur, prev, m) {
  if (!prev) return "";
  const sign = (x) => (x > 0 ? "+" : "");
  const gap = (new Date(cur.period_end) - new Date(prev.period_end)) / 864e5;
  const base = gap <= 120 ? "전 분기 대비" : `${prev.period_end} 값 대비`;
  if (m.unit === "USD" && m.id !== "operating_income" && prev.value > 0) {
    const p = (cur.value / prev.value - 1) * 100;
    return `${base} ${sign(p)}${p.toFixed(1)}%`;
  }
  const diff = cur.value - prev.value;
  if (m.unit === "USD") return `${base} ${sign(diff)}${fmt(diff, "USD")}`;
  if (m.unit === "%") return `${base} ${sign(diff)}${diff.toFixed(1)}%p`;
  return `${base} ${sign(diff)}${fmt(diff, m.unit)}`;
}
function spark(vals, unit) {
  if (vals.length < 2) return "";
  const W = 96, H = 28, P = 4;
  const ys = vals.map(v => v.value), lo = Math.min(...ys, 0), hi = Math.max(...ys, 0), span = hi - lo || 1;
  const x = (i) => P + i * (W - 2 * P) / (vals.length - 1), y = (v) => H - P - (v - lo) / span * (H - 2 * P);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v.value).toFixed(1)}`).join(" ");
  const zero = lo < 0 ? `<line x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>` : "";
  const hits = vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v.value).toFixed(1)}" r="7" fill="transparent"><title>${v.period_end}: ${fmt(v.value, unit)}</title></circle>`).join("");
  const last = vals.length - 1;
  return `<svg class="sp" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${vals.length}개 분기 추이">${zero}<polyline points="${pts}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last).toFixed(1)}" cy="${y(vals[last].value).toFixed(1)}" r="3" fill="var(--mark)"/>${hits}</svg>`;
}
function isFresh(v) {
  const f = (v.source.filings || [])[0];
  return f && daysAgo(f.filed) <= FRESH_DAYS;
}
function order(focal) {
  const f = C[focal];
  const peers = D.companies.filter(c => c.id !== focal && c.role === f.role);
  const others = D.companies.filter(c => c.id !== focal && c.role !== f.role);
  return [f, ...peers, ...others];
}
let selected = null;
function render() {
  const focal = document.getElementById("focal").value;
  const cols = order(focal);
  const rows = D.metrics.filter(m => m.show !== false && D.values.some(v => v.metric === m.id));
  let h = "<thead><tr><th class='m'>지표</th>";
  for (const c of cols) {
    const lp = latestPeriod(c.id);
    const other = c.role !== C[focal].role;
    h += `<th class="${other ? "sup" : ""}"><b>${esc(c.name)} <span class="muted">${esc(c.ticker)}</span></b>${ROLE[c.role] || ""}${c.id === focal ? " · 기준" : ""}<br>${lp ? `${lp.period_start} ~ ${lp.period_end}` : "분기 자료 없음"}</th>`;
  }
  h += "</tr></thead><tbody>";
  for (const m of rows) {
    h += `<tr><th class="m">${esc(m.name)}</th>`;
    for (const c of cols) {
      const s = series(c.id, m.id).slice(-5), cur = s[s.length - 1], prev = s[s.length - 2];
      const other = c.role !== C[focal].role, key = c.id + "|" + m.id;
      const cls = `c${other ? " sup" : ""}${selected === key ? " on" : ""}`;
      if (!cur) { const g = D.gaps[key] || {reason: "not_read"}; h += `<td class="${other ? "sup" : ""}" title="${esc(g.note || "")}"><span class="none">${GAP[g.reason] || "자료 없음"}</span></td>`; continue; }
      const lp = latestPeriod(c.id), pg = lp && D.gaps[key + "|" + lp.period_end];
      const stale = lp && cur.period_end !== lp.period_end ? `<div class="d"${pg ? ` title="${esc(pg.note || "")}"` : ""}>${cur.period_end} 기준${pg ? ` · 최신 분기는 ${GAP[pg.reason]}` : ""}</div>` : "";
      const label = m.kind === "text" && cur.source.label ? `<div class="d">${esc(cur.source.label)}</div>` : "";
      h += `<td class="${cls}" tabindex="0" data-key="${key}"><div class="v">${fmt(cur.value, m.unit)}${isFresh(cur) ? '<span class="tag">새 공시</span>' : ""}${stTag(cur)}</div>${label}<div class="d">${delta(cur, prev, m)}</div>${stale}${spark(s, m.unit)}</td>`;
    }
    h += "</tr>";
  }
  document.getElementById("grid").innerHTML = h + "</tbody>";
  document.getElementById("news").innerHTML = cols.map(c => {
    const f = latestFiling(c.id);
    if (!f) return `<a><b>${esc(c.name)}</b> · 반영된 공시 없음</a>`;
    const n = daysAgo(f.filed);
    return `<a class="${n <= FRESH_DAYS ? "fresh" : ""}" href="${esc(f.url || "#")}" target="_blank" rel="noopener"><b>${esc(c.name)}</b> · ${esc(f.form)} · ${f.filed} 제출 (${n}일 전)</a>`;
  }).join("");
  document.getElementById("rel").innerHTML = D.relations.length ? D.relations.map(r => {
    const s = r.source, a = C[r.counterparty]?.name || r.counterparty, b = C[r.company]?.name || r.company;
    return `<div><b>${esc(a)} → ${esc(b)}</b> · ${esc(r.what || "")} 공급<div class="q">${esc(s.quote)}</div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.form)} · ${esc(s.filed)} 제출</a></div>`;
  }).join("") : "<div>아직 넣은 관계가 없습니다.</div>";
}
function showPanel(key) {
  selected = key;
  const [cid, mid] = key.split("|"), m = M[mid], s = series(cid, mid).slice(-5).reverse();
  let h = `<h3>${esc(C[cid].name)} · ${esc(m.name)}</h3><p>${esc(m.definition)}</p><p>비교할 때: ${esc(m.comparability)}</p>`;
  h += "<table><thead><tr><th>기간</th><th>값</th><th>근거</th></tr></thead><tbody>";
  for (const v of s) {
    const src = v.source;
    const links = (src.filings || []).map(f => `<a href="${esc(f.url || "#")}" target="_blank" rel="noopener">${esc(f.form)} · ${esc(f.filed)} 제출</a>`).join(", ");
    const tag = src.tag ? ` · 항목 ${esc(src.tag)}` : "";
    const label = src.label ? ` · 원문 표현 "${esc(src.label)}"` : "";
    const quote = src.quote ? `<div class="q">${esc(src.quote)}</div>` : "";
    const parts = src.inputs ? `<div class="d" style="white-space:normal">재료: ${src.inputs.map(x => `<button class="b sm" data-act="panel" data-key="${esc(cid + "|" + x.metric)}">${esc(M[x.metric]?.name || x.metric)} ${fmt(x.value, x.unit)}</button>`).join(" ")}</div>` : "";
    const rv = v.review || {};
    const fix = rv.status === "corrected" ? `<div class="d">원래 값 ${fmt(rv.original_value, m.unit)} · 정정 이유: ${esc(rv.note)}</div>` : "";
    const btn = rv.status === "unreviewed" ? `<br><button class="b sm" data-act="review" data-key="${esc(cid + "|" + mid + "|" + v.period_end)}"${API ? "" : " disabled"}>검토함으로 표시</button><span class="err" data-err="${esc(cid + "|" + mid + "|" + v.period_end)}"></span>` : "";
    h += `<tr><td>${v.period_start ? v.period_start + " ~ " : ""}${v.period_end}</td><td>${fmt(v.value, m.unit)}${stTag(v)}${btn}</td><td>${links}${links ? " · " : ""}${esc(src.how || "")}${tag}${label}${quote}${parts}${fix}</td></tr>`;
  }
  if (!API && s.some(v => v.review?.status === "unreviewed")) h += `<tr><td colspan="3"><div class="off">${OFF_MSG}</div></td></tr>`;
  document.getElementById("panel").innerHTML = h + "</tbody></table>";
  render();
}
function chart(vals, unit) {
  if (!vals.length) return '<div class="none">자료 없음</div>';
  const W = 680, H = 180, L = 48, R = 48, T = 34, B = 30;
  const ys = vals.map(v => v.value), lo = Math.min(...ys, 0), hi = Math.max(...ys, 0), span = hi - lo || 1;
  const x = (i) => vals.length === 1 ? W / 2 : L + i * (W - L - R) / (vals.length - 1), y = (v) => H - B - (v - lo) / span * (H - T - B);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v.value).toFixed(1)}`).join(" ");
  let h = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="분기별 추이">`;
  h += `<line x1="${L - 20}" x2="${W - R + 20}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>`;
  h += `<polyline points="${pts}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v, i) => {
    h += `<circle cx="${x(i).toFixed(1)}" cy="${y(v.value).toFixed(1)}" r="4" fill="var(--mark)" stroke="var(--card)" stroke-width="2"><title>${v.period_start ? v.period_start + " ~ " : ""}${v.period_end}: ${fmt(v.value, unit)}</title></circle>`;
    h += `<text x="${x(i).toFixed(1)}" y="${(y(v.value) - 10).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--ink)">${fmt(v.value, unit)}</text>`;
    h += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--ink3)">~${v.period_end.slice(2)}</text>`;
  });
  return h + "</svg>";
}
function renderView(v) {
  let h = `<h2 style="margin-top:12px">${esc(v.title)}</h2><p class="muted">질문: ${esc(v.question)} · ${esc(v.created)}에 만든 화면</p>`;
  for (const b of v.blocks) {
    if (b.title) h += `<h2>${esc(b.title)}</h2>`;
    if (b.type === "note") h += `<div class="qa">${esc(b.text)}</div>`;
    if (b.type === "quotes") h += b.items.map(it => `<div class="qa"><b>${esc(C[it.company]?.name || it.company)} · ${it.period_start} ~ ${it.period_end}</b><div>${esc(it.ko)}</div><div class="q">${esc(it.text)}</div><a href="${esc(it.source.url)}" target="_blank" rel="noopener">${esc(it.source.form)} · ${esc(it.source.filed)} 제출</a></div>`).join("");
    if (b.type === "series") for (const cid of b.companies) {
      const s = series(cid, b.metric).slice(-(b.last || 6));
      h += `<div class="qa"><b>${esc(C[cid].name)} · ${esc(M[b.metric].name)}</b>${chart(s, M[b.metric].unit)}</div>`;
    }
  }
  document.getElementById("view").innerHTML = h;
}
// ---------- 가설 ----------
const GAP = {not_read: "아직 안 읽음", not_disclosed: "공시에 없음", not_applicable: "해당 없음"};
const RES = {held: "지켜짐", near: "가까워짐", reversed: "반대로 움직임", broken: "깨짐", unknown: "판정 불가"};
const TST = {held: "유지", near: "흔들림", reversed: "흔들림", broken: "깨짐", unknown: "판정 불가"};
const resTag = (r, names) => `<span class="st ${r === "held" ? "done" : r === "unknown" ? "" : "hot"}">${(names || RES)[r] || esc(r)}</span>`;
function basisLine(b, unit) {
  const f = b.filing || {};
  const link = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.form)} · ${esc(f.filed)} 제출</a>` : "근거 공시 없음";
  const st = ST[b.review] ? ` <span class="st ${ST[b.review][1]}">${ST[b.review][0]}</span>` : "";
  const more = b.metric ? ` · <button class="b sm" data-act="panel" data-key="${esc(b.company + "|" + b.metric)}">값의 근거 보기</button>` : "";
  return `<div>${esc(b.period_end)} 값 ${fmt(b.value, unit)}${st}${b.label ? ` · 원문 표현 "${esc(b.label)}"` : ""}<br>${link}${more}</div>`;
}
function judgeForm(t, c) {
  const key = `${t.id}|${c.id}|${t.period_end}`;
  return `<form class="f" data-form="judge" data-key="${esc(key)}"><select name="verdict"><option value="">판정을 고르세요</option><option value="held">지켜짐</option><option value="near">가까워짐</option><option value="broken">깨짐</option></select><input name="note" placeholder="판정 이유 (필수)"><button class="b"${API ? "" : " disabled"}>기록</button><span class="err" data-ferr></span><span class="err" data-err="${esc(key)}"></span></form>`;
}
function snapLine(s) {
  return s ? `${esc(s.period_end || "")} 분기 기준 ${TST[s.status] || esc(s.status)} (${(s.conditions || []).map(c => `${esc(c.name)}: ${RES[c.result] || esc(c.result)}`).join(" · ")})` : "기록 없음";
}
function decisionBlock(t) {

  let h = `<div class="row" style="margin-top:12px"><b>판단</b> <span class="muted">무엇을 하기로 했는지와 이유를 적어 둡니다. 고쳐 쓰지 않고 덧붙이기만 합니다.</span></div>`;
  for (const d of [...t.decisions].reverse()) {
    h += `<div class="qa" style="margin:6px 0"><b>${when(d)} · ${esc(d.decision)}${d.due ? '<span class="st hot">돌아볼 때</span>' : ""}</b><div>이유: ${esc(d.note)}</div><div class="d" style="white-space:normal">그때 본 것: ${snapLine(d.snapshot)}</div>`;
    for (const r of d.reflections) h += `<div class="q">돌아보기 ${when(r)} · ${esc(r.note)}<div class="d" style="white-space:normal">그때 본 것: ${snapLine(r.snapshot)}</div></div>`;
    if (d.due) h += `<div class="d" style="white-space:normal">이 판단 뒤에 새 분기(${esc(t.period_end)})가 들어왔습니다. 지금 모습: ${snapLine({period_end: t.period_end, status: t.status, conditions: t.conditions.map(c => ({name: c.name, result: c.verdict.result}))})}</div>`;
    h += `<form class="f" data-form="reflect" data-key="${esc(d.id)}"><input name="note" placeholder="돌아보기: 그때의 가설과 판단이 맞았는지"><button class="b"${API ? "" : " disabled"}>돌아보기 기록</button><span class="err" data-ferr></span><span class="err" data-err="${esc(d.id)}"></span></form></div>`;
  }
  h += `<form class="f" data-form="decide" data-key="${esc(t.id)}"><input name="decision" placeholder="하기로 한 것 (내 말로)" size="28"><input name="note" placeholder="이유 (필수)"><button class="b"${API ? "" : " disabled"}>판단 기록</button><span class="err" data-ferr></span><span class="err" data-err="decide|${esc(t.id)}"></span></form>`;

}
function thesisCard(t) {
  const n = t.conditions.length, cnt = ["held", "near", "reversed", "broken", "unknown"].filter(r => t.counts[r]).map(r => `${RES[r]} ${t.counts[r]}`).join(", ");

  if (t.note) h += `<div class="row">${esc(t.note)}</div>`;
  h += `<div class="row">최신 분기 ${esc(t.period_end || "모름")} 기준 · 조건 ${n}개 중 ${cnt}${t.created ? ` · ${esc(t.created)}에 만든 가설` : ""}</div>`;
  h += `<div class="wrap" style="margin-top:10px"><table><thead><tr><th>조건</th><th>기준</th><th>판정</th><th>근거</th></tr></thead><tbody>`;
  for (const c of t.conditions) {
    const v = c.verdict, p = c.previous;
    let verdict = `${resTag(v.result)}<div>${esc(v.text)}</div>`;
    if (v.trail?.length) verdict += `<div class="d" style="white-space:normal">최근 움직임: ${v.trail.map(m => `${esc(m.period_end.slice(2, 7))} ${m.ok ? esc(m.change) : `<b>${esc(m.change)} (반대)</b>`}`).join(" · ")}</div>`;
    if (v.by === "human") verdict += `<div class="d">사람이 판정함 · ${esc(String(v.ts || "").replace("T", " "))}</div>`;
    if (p) verdict += `<div class="d">${p.result !== v.result ? "달라짐: " : ""}그 앞 분기(${esc(p.period_end)})에는 ${RES[p.result]}</div>`;
    let basis = (v.basis || []).map(b => basisLine(b, c.unit)).join("");
    if (c.kind === "manual") {
      const view = (D.views || []).find(x => x.id === c.view);
      if (view) basis += `<button class="b sm" data-act="goto" data-id="${esc(view.id)}">읽을 자료: ${esc(view.title)}</button>`;
      basis += v.by === "human" ? `<details><summary>다시 판정</summary>${judgeForm(t, c)}</details>` : judgeForm(t, c);
    }
    h += `<tr><td>${esc(c.name)}</td><td>${esc(c.rule)}</td><td>${verdict}</td><td>${basis || '<span class="none">근거 없음</span>'}</td></tr>`;
  }
  return h + "</tbody></table></div>" + decisionBlock(t) + "</div>";
}
function renderTheses() {

  h += `<div class="qa"><b>읽는 법</b>지켜짐: 조건이 성립함 · 가까워짐: 성립하지만 기준에 가까움 · 반대로 움직임: 이번 분기에 가설과 반대 방향으로 감 · 깨짐: 성립하지 않음(방향 조건은 두 분기 연속 반대) · 판정 불가: 최신 분기의 값이나 판정 기록이 없음. 가설의 상태는 조건에서 나옵니다: 깨진 조건이 있으면 깨짐, 가까워졌거나 반대로 움직인 조건이 있으면 흔들림, 판정하지 못한 조건이 있으면 판정 불가, 모두 지켜지면 유지. 가설과 조건은 ontology/theses.json에서 고칩니다.</div>`;

}

function alertCard(a) {

}
function renderAlerts() {

const ACT = {review: "검토함으로 표시", correct: "값 정정", link: "가려진 고객 잇기", dismiss: "알림 닫기", judge: "조건 판정", decide: "판단", reflect: "돌아보기"};
function renderLog() {
  const rows = D.actions.map((a, i) => [a, i]).sort((x, y) => (x[0].ts < y[0].ts ? 1 : x[0].ts > y[0].ts ? -1 : y[1] - x[1])).map(([a]) => {
    const t = a.target || {};
    let what = "", did = ACT[a.type] || a.type;
    if (a.type === "review" || a.type === "correct") what = `${esc(cname(t.company))} · ${esc(M[t.metric]?.name || t.metric)} · ${esc(t.period_end)}`;
    if (a.type === "correct") did += `: 새 값 ${fmt(a.value, M[t.metric]?.unit)}`;
    if (a.type === "link") { what = `${esc(cname(t.company))} · 원문 표현 "${esc(t.label)}"`; did += a.counterparty ? `: ${esc(cname(a.counterparty))}` : ": 확인했지만 모름"; }
    if (a.type === "judge") { const th = D.theses.find(x => x.id === t.thesis), co = th?.conditions.find(x => x.id === t.condition); what = `${esc(th ? cname(th.company) : t.thesis)} · ${esc(co?.name || t.condition)} · ${esc(t.period_end)}`; did += `: ${RES[a.verdict] || esc(a.verdict)}`; }
    if (a.type === "decide") { const th = D.theses.find(x => x.id === t.thesis); what = th ? `${esc(cname(th.company))} · "${esc(th.statement)}"` : esc(t.thesis); did += `: ${esc(a.decision)}`; }
    if (a.type === "reflect") { const th = D.theses.find(x => x.decisions.some(d => d.id === t.decision)), d = th?.decisions.find(d => d.id === t.decision); what = d ? `${esc(cname(th.company))} · ${esc(String(d.ts).slice(0, 10))}의 판단 "${esc(d.decision)}"` : esc(t.decision); }
    if (a.type === "dismiss") { const al = D.alerts.find(x => x.id === t.alert_id); what = al ? `${esc(cname(al.company))} · ${esc(al.rule_name)} · ${esc(al.period_end)}` : esc(t.alert_id); }
    return `<tr><td>${esc(String(a.ts || "").replace("T", " "))}</td><td>${what}</td><td>${did}</td><td>${esc(a.note || "")}</td></tr>`;

}
// ---------- 행동 ----------
function showErr(key, msg) {
  for (const el of document.querySelectorAll("[data-err]")) if (el.dataset.err === key) el.textContent = msg ? " " + msg : "";
}
async function post(action, errKey) {
  showErr(errKey, "");
  try {
    const r = await fetch("/api/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(action)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { showErr(errKey, j.error || `기록하지 못했습니다 (${r.status}).`); return; }
    await reloadData();
  } catch (e) { showErr(errKey, "서버에 닿지 못했습니다. serve.py가 켜져 있는지 확인하세요."); }
}
function reloadData() {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "data.js?t=" + Date.now();
    s.onload = () => { s.remove(); loadData(); refresh(); res(); };
    s.onerror = () => { s.remove(); rej(new Error("data.js")); };
    document.body.appendChild(s);
  });
}
const UNIT_IN = {USD: ["억 달러", 1e8], "%": ["%", 1], MW: ["MW", 1]};

    const [u, k] = UNIT_IN[M[a.metric]?.unit] || ["", 1];

  } else {

  }

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || b.disabled) return;
  const card = b.closest(".al"), act = b.dataset.act;
  if (act === "goto") return showTab(b.dataset.id);
  if (act === "panel") { showTab("fixed"); showPanel(b.dataset.key); document.getElementById("panel").scrollIntoView({block: "start"}); return; }
  if (act === "review") {
    const [company, metric, period_end] = b.dataset.key.split("|");
    post({type: "review", target: {company, metric, period_end}, note: ""}, card ? card.dataset.aid : b.dataset.key);
  } else if (act === "dismiss") post({type: "dismiss", target: {alert_id: card.dataset.aid}, note: ""}, card.dataset.aid);
  else if (act === "open-correct") openForm(card, "correct");
  else if (act === "open-link") openForm(card, "link");
});
document.addEventListener("submit", e => {
  const form = e.target.closest("form.f");

  if (form.dataset.form === "decide" || form.dataset.form === "reflect") {
    const ferr = form.querySelector("[data-ferr]"), why = form.querySelector("[name=note]").value.trim(), key = form.dataset.key;
    if (!API) { ferr.textContent = OFF_MSG; return; }
    if (form.dataset.form === "reflect") {
      if (!why) { ferr.textContent = "돌아본 내용을 적으세요."; return; }
      return post({type: "reflect", target: {decision: key}, note: why}, key);
    }
    const decision = form.querySelector("[name=decision]").value.trim();
    if (!decision) { ferr.textContent = "하기로 한 것을 적으세요."; return; }
    if (!why) { ferr.textContent = "이유를 적으세요."; return; }
    return post({type: "decide", target: {thesis: key}, decision, note: why}, "decide|" + key);
  }
  if (form.dataset.form === "judge") {
    const ferr = form.querySelector("[data-ferr]"), verdict = form.querySelector("[name=verdict]").value, why = form.querySelector("[name=note]").value.trim();
    if (!API) { ferr.textContent = OFF_MSG; return; }
    if (!verdict) { ferr.textContent = "판정을 고르세요."; return; }
    if (!why) { ferr.textContent = "판정 이유를 적으세요."; return; }
    ferr.textContent = "";
    const [thesis, condition, period_end] = form.dataset.key.split("|");
    return post({type: "judge", target: {thesis, condition, period_end}, verdict, note: why}, form.dataset.key);
  }
  const card = form.closest(".al"), a = D.alerts.find(x => x.id === card.dataset.aid), ferr = form.querySelector("[data-ferr]");
  const note = form.querySelector("[name=note]").value.trim(), bad = (msg) => { ferr.textContent = msg; };
  if (!API) return bad(OFF_MSG);
  if (form.dataset.form === "correct") {
    const raw = form.querySelector("[name=value]").value.trim().replace(/,/g, "");
    if (!raw || !isFinite(Number(raw))) return bad("새 값을 숫자로 넣으세요.");
    if (!note) return bad("정정 이유를 적으세요.");
    const k = (UNIT_IN[M[a.metric]?.unit] || ["", 1])[1];
    const value = k === 1 ? Number(raw) : Math.round(Number(raw) * k);
    post({type: "correct", target: {company: a.company, metric: a.metric, period_end: a.period_end}, value, note}, a.id);
  } else {
    const cp = form.querySelector("[name=cp]").value;
    if (!cp) return bad("회사를 고르거나 확인했지만 모름을 고르세요.");
    if (!note) return bad("이유를 적으세요.");
    post({type: "link", target: {company: a.company, label: a.current.label}, counterparty: cp === "__null" ? null : cp, note}, a.id);
  }
});
// ---------- 탭 ----------
const tabs = document.getElementById("tabs");
let curTab = "fixed";
const PANES = ["fixed", "theses", "alerts", "log", "view"];
function renderTabs() {
  const n = D.alerts.filter(a => !a.dismissed).length;
  tabs.innerHTML = `<button data-id="fixed">고정 화면</button><button data-id="theses">가설 (${D.theses.length})</button><button data-id="alerts">알림 (${n})</button><button data-id="log">기록</button>` + (D.views || []).map(v => `<button data-id="${esc(v.id)}">${esc(v.title)}</button>`).join("");
  for (const b of tabs.children) b.setAttribute("aria-pressed", String(b.dataset.id === curTab));
}
function showTab(id) {
  curTab = id;
  const pane = PANES.includes(id) && id !== "view" ? id : "view";
  for (const p of PANES) document.getElementById(p).hidden = p !== pane;
  if (pane === "theses") renderTheses();
  if (pane === "alerts") renderAlerts();
  if (pane === "log") renderLog();
  if (pane === "view") renderView(D.views.find(v => v.id === id));
  for (const b of tabs.children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
}
function refresh() {
  document.getElementById("gen").textContent = `자료를 만든 때: ${D.generated}`;
  renderTabs();
  showTab(curTab);
  if (selected) showPanel(selected); else render();
}
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.id); });
const sel = document.getElementById("focal");
sel.innerHTML = D.companies.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
sel.addEventListener("change", render);
document.getElementById("grid").addEventListener("click", e => { const td = e.target.closest("td.c"); if (td) showPanel(td.dataset.key); });
document.getElementById("grid").addEventListener("keydown", e => { const td = e.target.closest("td.c"); if (td && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showPanel(td.dataset.key); } });
refresh();
fetch("/api/ping", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(j => { API = !!(j && j.ok); refresh(); }).catch(() => {});
</script>
