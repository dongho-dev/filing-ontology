<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공시 온톨로지</title>
<style>
:root{
  color-scheme:light;
  --page:#f4f3ef;--surface:#fcfcfb;--raise:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#898781;
  --grid:#e8e7e1;--axis:#c3c2b7;--line:rgba(11,11,11,.09);--wash:#efeee9;--hover:#f3f2ee;
  --s1:#2a78d6;--s1soft:#b7d3f6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --cost1:#8f8c84;--cost2:#cfccc3;
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--goodtxt:#006300;--crittxt:#b42e2e;
  --accent:#2a78d6;--accentwash:#e8f1fc;--accentink:#1c5cab;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --page:#0f0f0e;--surface:#1a1a19;--raise:#202020;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#898781;
  --grid:#2c2c2a;--axis:#45453f;--line:rgba(255,255,255,.09);--wash:#262624;--hover:#262624;
  --s1:#3987e5;--s1soft:#1c3f6b;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --cost1:#77756e;--cost2:#45443f;
  --goodtxt:#0ca30c;--crittxt:#e66767;
  --accent:#3987e5;--accentwash:#16263a;--accentink:#9ec5f4;
  --shadow:none;
}}
:root[data-theme=dark]{color-scheme:dark;--page:#0f0f0e;--surface:#1a1a19;--raise:#202020;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#898781;--grid:#2c2c2a;--axis:#45453f;--line:rgba(255,255,255,.09);--wash:#262624;--hover:#262624;--s1:#3987e5;--s1soft:#1c3f6b;--s2:#d95926;--s3:#199e70;--s4:#c98500;--cost1:#77756e;--cost2:#45443f;--goodtxt:#0ca30c;--crittxt:#e66767;--accent:#3987e5;--accentwash:#16263a;--accentink:#9ec5f4;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:4px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:14px}
nav.tabs button:hover{background:var(--hover);color:var(--ink)}
nav.tabs button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center}
.gen{margin-left:auto;font-size:12px;color:var(--ink3)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 64px}
.muted{color:var(--ink3);font-size:12px}
h2.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:28px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec .muted{font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-size:14px}
.pill:hover{background:var(--hover)}
.pill[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pill .tk{color:var(--ink3);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
/* 회사 머리 */
.co-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.co-head h1{font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.2}
.co-head .sub{color:var(--ink2);font-size:13px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--ink2);text-decoration:none;white-space:nowrap}
.chip.fresh{background:var(--accentwash);color:var(--accentink)}
.chip b{font-weight:600}
/* 가설 띠 */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:14px}
.th-mini{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:100%}
.th-mini:hover{background:var(--hover)}
.th-mini .stmt{font-weight:600;font-size:14px;line-height:1.35}
.th-mini .cnd{font-size:12px;color:var(--ink2);margin-top:4px}
.th-mini>div{flex:1;min-width:0}
/* 상태 표시 */
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 4px;border-radius:999px;background:var(--wash);color:var(--ink);white-space:nowrap}
.status i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;line-height:1}
.status.held i{background:var(--good)}.status.near i,.status.reversed i{background:var(--warn);color:#0b0b0b}.status.broken i{background:var(--crit)}.status.unknown i{background:var(--ink3)}
.status.big{font-size:14px;padding:4px 12px 4px 5px}.status.big i{width:20px;height:20px;font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.kpi{padding:14px 16px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--axis)}
.kpi .lab{font-size:12px;color:var(--ink2)}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.kpi .per{font-size:11px;color:var(--ink3)}
.delta{font-size:12px;font-weight:600;white-space:nowrap}
.delta.good{color:var(--goodtxt)}.delta.bad{color:var(--crittxt)}.delta.flat{color:var(--ink2)}
.delta .base{font-weight:400;color:var(--ink3)}
.kpi svg{margin-top:6px}
/* 차트 격자 */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.chart-card{padding:16px 18px 10px}
.chart-card h3{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.chart-card .cap{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .ln{width:14px;height:0;border-top:2px solid}
svg.viz{display:block;width:100%;height:auto;overflow:visible}
svg.viz text{font-family:inherit}
.tick{font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.vlab{font-size:12px;fill:var(--ink);font-weight:600}
.vlab2{font-size:11px;fill:var(--ink2)}
.hit{fill:transparent;cursor:pointer}
.xh{stroke:var(--axis);stroke-width:1;visibility:hidden;pointer-events:none}
/* 부문 */
.seg{padding:18px}
.seg-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.seg-head h3{font-size:18px;margin:0;letter-spacing:-.01em}
.seg-head p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:720px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 6px}
.fact{background:var(--page);border-radius:12px;padding:12px 14px;cursor:pointer;border:1px solid transparent}
.fact:hover{border-color:var(--axis)}
.fact .lab{font-size:12px;color:var(--ink2)}
.fact .val{font-size:24px;font-weight:650;letter-spacing:-.02em}
.fact .note{font-size:12px;color:var(--ink3)}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--accentwash);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;margin:10px 0 4px}
.callout b{font-weight:650}
.callout .ic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
/* 지표 카드 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mcard{padding:12px 14px 8px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:0}
.mcard:hover{border-color:var(--axis)}
.mcard .lab{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.mcard .val{font-size:18px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.mcard.on,.kpi.on,.fact.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.gaps{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.8}
.gaps span{display:inline-block;background:var(--wash);border-radius:6px;padding:0 8px;margin:0 4px 4px 0;color:var(--ink2)}
/* 비교 */
.cmp-row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;min-height:30px;cursor:pointer;border-radius:6px;padding:0 4px}
.cmp-row:hover{background:var(--hover)}
.cmp-row .nm{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.cmp-row.gap{cursor:default}.cmp-row.gap:hover{background:none}
.cmp-row .why{font-size:12px;color:var(--ink3)}
.track{position:relative;height:22px;display:block}
.track .hb{position:absolute;top:4px;height:14px;border-radius:0 4px 4px 0}
.track .hb.neg{border-radius:4px 0 0 4px}
.track .z{position:absolute;top:0;bottom:0;width:1px;background:var(--axis)}
.track .hl{position:absolute;top:1px;font-size:12px;white-space:nowrap;color:var(--ink)}
.track .hl b{font-weight:650}.track .hl span{color:var(--ink3);font-size:11px}
.rel-wrap{padding:14px 18px}
.rel-wrap svg.viz{max-width:640px;margin:0 auto}
details.tbl>summary{cursor:pointer;color:var(--ink2);font-size:13px;margin:18px 0 8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
thead th{font-weight:500;color:var(--ink2);font-size:12px}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* 서랍 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:31;box-shadow:-8px 0 32px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
aside.drawer.on{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.dr-head h3{margin:0;font-size:18px;letter-spacing:-.01em}
.dr-head .muted{margin-top:2px}
.dr-body{overflow:auto;padding:14px 20px 32px}
.dr-body p{margin:6px 0;color:var(--ink2);font-size:13px}
.xbtn{border:0;background:var(--wash);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.xbtn:hover{background:var(--hover)}
.q{border-left:2px solid var(--axis);padding-left:10px;color:var(--ink2);font-size:12px;margin:6px 0;word-break:break-word}
.src{font-size:12px}
.st{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--ink3);margin-left:6px;vertical-align:1px;font-weight:400;white-space:nowrap}
.st.done{border-color:transparent;background:var(--wash);color:var(--ink2)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--accentwash);color:var(--accentink);margin-left:6px;vertical-align:2px;font-weight:500}
/* 가설·알림·기록 */
.th-card{padding:18px 20px;margin-bottom:14px}
.th-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.th-top h3{margin:0;font-size:19px;letter-spacing:-.01em;line-height:1.35}
.th-top .meta{font-size:12px;color:var(--ink3);margin-top:4px}
.th-note{font-size:13px;color:var(--ink2);margin:8px 0 0}
.conds{margin-top:14px;display:grid;gap:10px}
.cond{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:start}
@media (max-width:640px){.cond{grid-template-columns:1fr}}
.cond h4{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cond .rule{font-size:12px;color:var(--ink3);margin-top:2px}
.cond .vt{font-size:13px;margin-top:6px}
.trail{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.trail span{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.trail span.rev{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crittxt);font-weight:600}
.basis{font-size:12px;color:var(--ink2);margin-top:6px}
details>summary{cursor:pointer;font-size:12px;color:var(--ink2);margin-top:6px}
.dec{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.dec h4{margin:0 0 4px;font-size:13px}
.tl{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px;font-size:13px}
.tl .it::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink3)}
.tl .it.due::before{border-color:var(--warn);background:var(--warn)}
.al{padding:14px 18px;margin-bottom:10px}
.al h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.al .row{font-size:13px;color:var(--ink2);margin:4px 0}
.al ul{margin:4px 0;padding-left:20px;font-size:13px;color:var(--ink2)}
.fromto{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.fromto .b1{background:var(--page);border-radius:10px;padding:8px 12px;min-width:120px}
.fromto .b1 .k{font-size:11px;color:var(--ink3)}
.fromto .b1 .v{font-size:16px;font-weight:650}
.fromto .arr{color:var(--ink3);font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button.b{font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);cursor:pointer}
button.b:hover{border-color:var(--axis)}
button.b:disabled{color:var(--ink3);cursor:not-allowed}
button.b.sm{font-size:12px;padding:2px 9px;margin:2px 2px 0 0}
form.f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--page);font-size:13px}
form.f input,form.f select{font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
form.f input[name=note]{flex:1 1 220px}
.err{font-size:12px;font-weight:600;color:var(--crittxt)}
.off{font-size:13px;color:var(--ink2);background:var(--wash);border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.empty{padding:24px;text-align:center;color:var(--ink3)}
.qa{padding:14px 18px;margin-bottom:10px;font-size:14px}
.qa b{display:block;margin-bottom:4px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;max-width:300px;opacity:0;transition:opacity .08s;white-space:pre-line}
#tip b{font-weight:650}
footer{margin-top:40px;font-size:12px;color:var(--ink3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <span class="brand">공시 온톨로지</span>
  <nav class="tabs" id="tabs"></nav>
  <a href="nebius-flow.html" style="font-size:13px;white-space:nowrap;color:inherit">네비우스 돈의 흐름</a>
  <a href="nebius-journey.html" style="font-size:13px;white-space:nowrap;color:inherit">네비우스 처음부터 지금까지</a>
  <a href="nebius-story.html" style="font-size:13px;white-space:nowrap;color:inherit">쉬운 설명</a>
  <a href="nebius-quarters.html" style="font-size:13px;white-space:nowrap;color:inherit">분기 비교</a>
  <span class="gen" id="gen"></span>
</div></header>
<main>
  <section id="pane-overview"></section>
  <section id="pane-compare" hidden></section>
  <section id="pane-theses" hidden></section>
  <section id="pane-alerts" hidden></section>
  <section id="pane-log" hidden></section>
  <section id="pane-view" hidden></section>
  <footer>공개된 공시 정보를 정리한 화면입니다. 종목을 추천하거나 투자 판단을 대신하지 않습니다.</footer>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="값의 근거">
  <div class="dr-head"><div id="dr-title"></div><button class="xbtn" id="dr-close" aria-label="닫기">✕</button></div>
  <div class="dr-body" id="panel"></div>
</aside>
<div id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script>
// ---------- 자료 ----------
const ROLE = {gpu_cloud: "GPU 클라우드", gpu_supplier: "GPU 공급사"};
const FRESH_DAYS = 14;
const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
let D, C, M, genDate;
function loadData() {
  D = window.DATA;
  D.alerts = D.alerts || []; D.actions = D.actions || []; D.theses = D.theses || []; D.gaps = D.gaps || {};
  C = byId(D.companies); M = byId(D.metrics);
  genDate = new Date(D.generated.slice(0, 10));
}
loadData();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const daysAgo = (iso) => Math.round((genDate - new Date(iso)) / 864e5);
const cname = (id) => C[id]?.name || id;
const ccolor = (id) => `var(--s${(D.companies.findIndex(c => c.id === id) % 4) + 1})`;
let API = false;
const OFF_MSG = "행동을 기록하려면 python scripts/serve.py로 여세요.";
const ST = {unreviewed: ["검토 전", ""], inputs_unreviewed: ["재료 값 검토 전", ""], reviewed: ["검토함", "done"], corrected: ["정정됨", "done"]};
const GAP = {not_read: "아직 안 읽음", not_disclosed: "공시에 없음", not_applicable: "해당 없음"};
const RES = {held: "지켜짐", near: "가까워짐", reversed: "반대로 움직임", broken: "깨짐", unknown: "판정 불가"};
const TST = {held: "유지", near: "흔들림", reversed: "흔들림", broken: "깨짐", unknown: "판정 불가"};
const ICON = {held: "✓", near: "!", reversed: "!", broken: "✕", unknown: "?"};
// 값이 커지면 좋은 지표(+1), 작아지면 좋은 지표(-1). 없으면 방향을 칠하지 않는다.

function fmt(v, unit) {

  }
  if (unit === "%") return v.toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "%";
  if (unit === "MW") return Math.round(v).toLocaleString("ko-KR") + " MW";
  if (unit === "x") return v.toLocaleString("ko-KR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + "배";

}
function fmtShort(v, unit) {
  if (unit === "USD") {
    const x = v / 1e8, a = Math.abs(x);
    return x.toLocaleString("ko-KR", {maximumFractionDigits: a >= 100 ? 0 : a >= 10 ? 1 : 2}) + "억";
  }
  if (unit === "%") return v.toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "%";
  if (unit === "x") return v.toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "배";

const periodText = (v) => `${v.period_start ? v.period_start + " ~ " : ""}${v.period_end}`;
function delta(cur, prev, m) {
  if (!prev) return null;
  const sign = (x) => (x > 0 ? "+" : "");
  const gap = (new Date(cur.period_end) - new Date(prev.period_end)) / 864e5;
  const base = gap <= 120 ? "전 분기 대비" : `${prev.period_end} 대비`;
  const diff = cur.value - prev.value;
  let text;
  if (m.unit === "USD" && m.id !== "operating_income" && prev.value > 0) text = `${sign(diff)}${((cur.value / prev.value - 1) * 100).toFixed(1)}%`;
  else if (m.unit === "USD") text = `${sign(diff)}${fmt(diff, "USD")}`;
  else if (m.unit === "%") text = `${sign(diff)}${diff.toFixed(1)}%p`;
  else text = `${sign(diff)}${fmt(diff, m.unit)}`;

}
function deltaHtml(cur, prev, m, withBase = true) {
  const d = delta(cur, prev, m);

}

function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { hi = lo + 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 1e-9; t += step) out.push(+t.toFixed(10));
  if (out[out.length - 1] < hi) out.push(out[out.length - 1] + step);
  return out;
}
function tipAttr(lines) { return ` data-tip="${esc(lines.filter(Boolean).join("\n"))}"`; }
function roundedBar(x, y0, y1, w, r = 4) {
  // y0는 기준선, y1은 값 쪽 끝. 값 쪽 끝만 둥글게.
  const up = y1 < y0, h = Math.abs(y1 - y0); r = Math.min(r, h, w / 2);
  if (h < 0.5) return "";
  if (up) return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
// 한 계열 막대. vals: [{period_end, value, ...}]
function colChart(vals, m, opt = {}) {
  if (!vals.length) return `<div class="empty">자료 없음</div>`;
  const W = opt.w || 600, H = opt.h || 200, L = opt.mini ? 4 : 46, R = 8, T = opt.mini ? 4 : 22, B = opt.mini ? 4 : 24;
  const ys = vals.map(v => v.value).concat(opt.ref != null ? [opt.ref] : []), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const ticks = niceTicks(lo, hi), tlo = ticks[0], thi = ticks[ticks.length - 1];
  const y = (v) => T + (thi - v) / (thi - tlo || 1) * (H - T - B);
  const band = (W - L - R) / vals.length, bw = Math.min(opt.mini ? 14 : 24, band * 0.62);
  let h = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} 분기별 막대">`;
  if (!opt.mini) for (const t of ticks) h += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="tick" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${esc(fmtShort(t, m.unit))}</text>`;
  h += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  if (opt.ref != null && opt.ref !== 0) h += refLine(L, W - R, y(opt.ref));
  vals.forEach((v, i) => {
    const x = L + band * i + (band - bw) / 2, last = i === vals.length - 1;
    const fill = opt.color || (last ? "var(--s1)" : "var(--s1soft)");
    h += `<path d="${roundedBar(x, y(0), y(v.value), bw)}" fill="${fill}"/>`;
    if (!opt.mini) h += `<text class="tick" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${qlabel(v.period_end)}</text>`;
    if (!opt.mini && (last || v.value === Math.max(...ys) && i !== vals.length - 1 && false)) h += `<text class="vlab" x="${x + bw / 2}" y="${v.value >= 0 ? y(v.value) - 6 : y(v.value) + 14}" text-anchor="middle">${esc(fmtShort(v.value, m.unit))}</text>`;
    const prev = vals[i - 1], d = prev ? delta(v, prev, m) : null;
    h += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}"${tipAttr([`<b>${periodText(v)}</b>`, `${m.name} ${fmt(v.value, m.unit)}`, d ? `${d.base} ${d.text}` : ""])}${opt.key ? ` data-open="${esc(opt.key)}"` : ""}/>`;
  });
  return h + "</svg>";
}
// 여러 계열 선. periods: [pe], series: [{name, color, vals: {pe: value}}], ranges: [{pe, lo, hi, color, note}]
function lineChart(periods, ser, unit, opt = {}) {
  if (!periods.length) return `<div class="empty">자료 없음</div>`;
  const W = opt.w || 600, H = opt.h || 200, L = opt.mini ? 4 : 46, R = opt.mini ? 4 : (opt.endLabels === false ? 12 : 72), T = opt.mini ? 6 : 16, B = opt.mini ? 6 : 24;
  const all = ser.flatMap(s => periods.map(p => s.vals[p]).filter(v => v != null)).concat((opt.ranges || []).flatMap(r => [r.lo, r.hi])).concat(opt.ref != null ? [opt.ref] : []);
  if (!all.length) return `<div class="empty">자료 없음</div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (opt.zero !== false) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const ticks = niceTicks(lo, hi), tlo = ticks[0], thi = ticks[ticks.length - 1];
  const y = (v) => T + (thi - v) / (thi - tlo || 1) * (H - T - B);
  const x = (i) => periods.length === 1 ? (L + W - R) / 2 : L + 10 + i * (W - L - R - 20) / (periods.length - 1);
  let h = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ser.map(s => s.name).join(", "))} 분기별 추이">`;
  if (!opt.mini) for (const t of ticks) h += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? "var(--axis)" : "var(--grid)"}"/><text class="tick" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${esc(fmtShort(t, unit))}</text>`;
  else if (tlo < 0) h += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  if (!opt.mini) periods.forEach((p, i) => { h += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="middle">${qlabel(p)}</text>`; });
  if (opt.ref != null) h += refLine(L, W - R, y(opt.ref));
  h += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}"/>`;
  for (const r of opt.ranges || []) {
    const i = periods.indexOf(r.pe); if (i < 0) continue;
    h += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(r.lo)}" y2="${y(r.hi)}" stroke="${r.color}" stroke-width="3" stroke-linecap="round" opacity=".8"/>`;
    for (const v of [r.lo, r.hi]) h += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--surface)" stroke="${r.color}" stroke-width="2"/>`;
  }
  const ends = [];
  ser.forEach(s => {
    let seg = [];
    const flush = () => { if (seg.length > 1) h += `<polyline points="${seg.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; seg = []; };
    periods.forEach((p, i) => { const v = s.vals[p]; if (v == null) flush(); else seg.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });
    flush();
    periods.forEach((p, i) => { const v = s.vals[p]; if (v != null && (!opt.mini || i === periods.length - 1)) h += `<circle cx="${x(i)}" cy="${y(v)}" r="${opt.mini ? 3 : 4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
    const li = periods.map(p => s.vals[p]).findLastIndex(v => v != null);
    if (li >= 0) ends.push({s, i: li, v: s.vals[periods[li]]});
  });
  if (!opt.mini && opt.endLabels !== false) {
    const placed = ends.map(e => ({...e, yy: y(e.v)})).sort((a, b) => a.yy - b.yy);
    for (let k = 1; k < placed.length; k++) if (placed[k].yy - placed[k - 1].yy < 15) placed[k].yy = placed[k - 1].yy + 15;
    for (const e of placed) {
      if (Math.abs(e.yy - y(e.v)) > 2) h += `<line x1="${x(e.i) + 6}" x2="${x(e.i) + 12}" y1="${y(e.v)}" y2="${e.yy - 4}" stroke="var(--axis)"/>`;
      h += `<text class="vlab" x="${x(e.i) + 14}" y="${e.yy}">${esc(fmtShort(e.v, unit))}</text>`;
    }
  }
  periods.forEach((p, i) => {
    const w = periods.length === 1 ? W - L - R : (W - L - R - 20) / (periods.length - 1);
    const lines = [`<b>${p}</b>`].concat(ser.map(s => s.vals[p] != null ? `${s.name} ${fmt(s.vals[p], unit)}` : `${s.name} ${s.missing?.[p] || "값 없음"}`));
    for (const r of opt.ranges || []) if (r.pe === p) lines.push(r.note);
    h += `<rect class="hit" x="${x(i) - w / 2}" y="${T}" width="${w}" height="${H - T - B}" data-xh="${x(i)}"${tipAttr(lines)}${opt.key ? ` data-open="${esc(opt.key)}"` : ""}/>`;
  });
  return h + "</svg>";
}

function metricChart(cid, mid, opt = {}) {

}

function hbars(mid) {
  const m = M[mid];
  const rows = D.companies.map(c => { const s = series(c.id, mid); return {c, cur: s.at(-1), prev: s.at(-2)}; });
  const vals = rows.filter(r => r.cur).map(r => r.cur.value);
  if (!vals.length) return "";
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const padL = lo < 0 ? 30 : 0, padR = hi > 0 ? 32 : 2;
  const pos = (v) => padL + (v - lo) / (hi - lo || 1) * (100 - padL - padR);
  let h = "";
  for (const r of rows) {
    if (!r.cur) {
      const g = gapOf(r.c.id, mid);
      h += `<div class="cmp-row gap"${g?.note ? ` title="${esc(g.note)}"` : ""}><span class="nm"><i class="dot" style="background:${ccolor(r.c.id)}"></i>${esc(r.c.name)}</span><span class="why">${esc(GAP[g?.reason] || "자료 없음")}</span></div>`;
      continue;
    }
    const x0 = pos(0), x1 = pos(r.cur.value), neg = r.cur.value < 0, key = `${r.c.id}|${mid}`, d = delta(r.cur, r.prev, m);
    const bar = `<span class="hb${neg ? " neg" : ""}" style="left:${Math.min(x0, x1)}%;width:max(2px,${Math.abs(x1 - x0)}%);background:${ccolor(r.c.id)}"></span>`;
    const lab = `<span class="hl" style="${neg ? `right:calc(${100 - x1}% + 6px)` : `left:calc(${x1}% + 6px)`}"><b>${esc(fmtShort(r.cur.value, m.unit))}</b> <span>${esc(qlabel(r.cur.period_end))}</span></span>`;
    h += `<div class="cmp-row" data-open="${esc(key)}"${tipAttr([`<b>${r.c.name} · ${m.name}</b>`, periodText(r.cur), fmt(r.cur.value, m.unit), d ? `${d.base} ${d.text}` : ""])}><span class="nm"><i class="dot" style="background:${ccolor(r.c.id)}"></i>${esc(r.c.name)}</span><span class="track">${lo < 0 ? `<span class="z" style="left:${x0}%"></span>` : ""}${bar}${lab}</span></div>`;

function relDiagram() {

// ---------- 가설 ----------
function basisLine(b, unit) {
  const f = b.filing || {};
  const link = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.form)} · ${esc(f.filed)} 제출</a>` : "근거 공시 없음";
  const st = ST[b.review] ? ` <span class="st ${ST[b.review][1]}">${ST[b.review][0]}</span>` : "";
  const more = b.metric ? ` <button class="b sm" data-act="panel" data-key="${esc(b.company + "|" + b.metric)}">근거 보기</button>` : "";
  return `<div class="basis">${esc(b.period_end)} 값 <b>${fmt(b.value, unit)}</b>${st}${b.label ? ` · 원문 표현 "${esc(b.label)}"` : ""} · ${link}${more}</div>`;
}
function judgeForm(t, c) {
  const key = `${t.id}|${c.id}|${t.period_end}`;
  return `<form class="f" data-form="judge" data-key="${esc(key)}"><select name="verdict"><option value="">판정을 고르세요</option><option value="held">지켜짐</option><option value="near">가까워짐</option><option value="broken">깨짐</option></select><input name="note" placeholder="판정 이유 (필수)"><button class="b"${API ? "" : " disabled"}>기록</button><span class="err" data-ferr></span><span class="err" data-err="${esc(key)}"></span></form>`;
}
function snapLine(s) {
  return s ? `${esc(s.period_end || "")} 분기 기준 ${TST[s.status] || esc(s.status)} (${(s.conditions || []).map(c => `${esc(c.name)}: ${RES[c.result] || esc(c.result)}`).join(" · ")})` : "기록 없음";
}
function trailHtml(trail) {
  return trail?.length ? `<div class="trail">${trail.map(m => `<span class="${m.ok ? "" : "rev"}">${esc(qlabel(m.period_end))} ${esc(m.change)}${m.ok ? "" : " 반대"}</span>`).join("")}</div>` : "";
}
function decisionBlock(t) {

  if (t.decisions.length) h += `<div class="tl">`;
  for (const d of [...t.decisions].reverse()) {
    h += `<div class="it${d.due ? " due" : ""}"><b>${esc(d.decision)}</b> <span class="muted">${when(d)}</span>${d.due ? ' <span class="status near"><i>!</i>돌아볼 때</span>' : ""}<div>이유: ${esc(d.note)}</div><div class="muted">그때 본 것: ${snapLine(d.snapshot)}</div>`;
    for (const r of d.reflections) h += `<div class="q">돌아보기 ${when(r)} · ${esc(r.note)}<div class="muted">그때 본 것: ${snapLine(r.snapshot)}</div></div>`;
    if (d.due) h += `<div class="muted">이 판단 뒤에 새 분기(${esc(t.period_end)})가 들어왔습니다. 지금 모습: ${snapLine({period_end: t.period_end, status: t.status, conditions: t.conditions.map(c => ({name: c.name, result: c.verdict.result}))})}</div>`;
    h += `<form class="f" data-form="reflect" data-key="${esc(d.id)}"><input name="note" placeholder="돌아보기: 그때의 가설과 판단이 맞았는지"><button class="b"${API ? "" : " disabled"}>돌아보기 기록</button><span class="err" data-ferr></span><span class="err" data-err="${esc(d.id)}"></span></form></div>`;
  }
  if (t.decisions.length) h += `</div>`;
  h += `<form class="f" data-form="decide" data-key="${esc(t.id)}"><input name="decision" placeholder="하기로 한 것 (내 말로)" size="28"><input name="note" placeholder="이유 (필수)"><button class="b"${API ? "" : " disabled"}>판단 기록</button><span class="err" data-ferr></span><span class="err" data-err="decide|${esc(t.id)}"></span></form></div>`;
  return h;
}
function thesisCard(t) {
  let h = `<div class="card th-card"><div class="th-top"><div><div class="muted"><i class="dot" style="background:${ccolor(t.company)};width:8px;height:8px"></i> ${esc(cname(t.company))}${t.example ? ' · <span class="st">예시</span>' : ""}</div><h3>${esc(t.statement)}</h3><div class="meta">최신 분기 ${esc(t.period_end || "모름")} 기준${t.created ? ` · ${esc(t.created)}에 세움` : ""}</div></div>${statusPill(t.status, TST, true)}</div>`;

    if (v.by === "human") main += `<div class="muted">사람이 판정함 · ${esc(String(v.ts || "").replace("T", " "))}</div>`;

    const side = s.length ? `<div style="cursor:pointer" data-open="${esc(t.company + "|" + c.metric)}">${metricChart(t.company, c.metric, {mini: true, w: 200, h: 70, ref: c.threshold})}<div class="muted">${esc(M[c.metric]?.name || "")} · ${esc(qlabel(s[0].period_end))} ~ ${esc(qlabel(s.at(-1).period_end))}</div></div>` : "";
    h += `<div class="cond"><div>${main}</div><div>${side}</div></div>`;

function renderTheses() {
  let h = `<div class="co-head" style="margin-top:0"><div><h1>가설</h1><div class="sub">내가 세운 가설의 조건을 최신 분기 값에 비춘 결과입니다. 조건과 값 사이의 관계만 말하고, 무엇을 할지는 말하지 않습니다.</div></div></div>`;

// ---------- 기록 ----------
const ACT = {review: "검토함으로 표시", correct: "값 정정", link: "가려진 고객 잇기", dismiss: "알림 닫기", judge: "조건 판정", decide: "판단", reflect: "돌아보기"};
function renderLog() {
  const rows = D.actions.map((a, i) => [a, i]).sort((x, y) => (x[0].ts < y[0].ts ? 1 : x[0].ts > y[0].ts ? -1 : y[1] - x[1])).map(([a]) => {
    const t = a.target || {};
    let what = "", did = ACT[a.type] || a.type;
    if (a.type === "review" || a.type === "correct") what = `${esc(cname(t.company))} · ${esc(M[t.metric]?.name || t.metric)} · ${esc(t.period_end)}`;
    if (a.type === "correct") did += `: 새 값 ${fmt(a.value, M[t.metric]?.unit)}`;
    if (a.type === "link") { what = `${esc(cname(t.company))} · 원문 표현 "${esc(t.label)}"`; did += a.counterparty ? `: ${esc(cname(a.counterparty))}` : ": 확인했지만 모름"; }
    if (a.type === "judge") { const th = D.theses.find(x => x.id === t.thesis), co = th?.conditions.find(x => x.id === t.condition); what = `${esc(th ? cname(th.company) : t.thesis)} · ${esc(co?.name || t.condition)} · ${esc(t.period_end)}`; did += `: ${RES[a.verdict] || esc(a.verdict)}`; }
    if (a.type === "decide") { const th = D.theses.find(x => x.id === t.thesis); what = th ? `${esc(cname(th.company))} · "${esc(th.statement)}"` : esc(t.thesis); did += `: ${esc(a.decision)}`; }
    if (a.type === "reflect") { const th = D.theses.find(x => x.decisions.some(d => d.id === t.decision)), d = th?.decisions.find(d => d.id === t.decision); what = d ? `${esc(cname(th.company))} · ${esc(String(d.ts).slice(0, 10))}의 판단 "${esc(d.decision)}"` : esc(t.decision); }
    if (a.type === "dismiss") { const al = D.alerts.find(x => x.id === t.alert_id); what = al ? `${esc(cname(al.company))} · ${esc(al.rule_name)} · ${esc(al.period_end)}` : esc(t.alert_id); }
    return `<tr><td style="white-space:nowrap">${esc(String(a.ts || "").replace("T", " "))}</td><td>${what}</td><td>${did}</td><td>${esc(a.note || "")}</td></tr>`;
  });
  const body = rows.length ? rows.join("") : `<tr><td colspan="4" class="empty">아직 기록이 없습니다.</td></tr>`;
  document.getElementById("pane-log").innerHTML = `<div class="co-head" style="margin-top:0"><div><h1>기록</h1><div class="sub">사람이 한 행동입니다. 최신순. 다음 빌드에서 값과 알림에 반영됩니다.</div></div></div><div class="card wrap"><table><thead><tr><th>언제</th><th>무엇에</th><th>무엇을</th><th>이유</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

    if (b.title) h += `<h2 class="sec">${esc(b.title)}</h2>`;
    if (b.type === "note") h += `<div class="card qa">${esc(b.text)}</div>`;
    if (b.type === "quotes") h += b.items.map(it => `<div class="card qa"><b>${esc(cname(it.company))} · ${it.period_start} ~ ${it.period_end}</b><div>${esc(it.ko)}</div><div class="q">${esc(it.text)}</div><a href="${esc(it.source.url)}" target="_blank" rel="noopener">${esc(it.source.form)} · ${esc(it.source.filed)} 제출</a></div>`).join("");
    if (b.type === "series") h += `<div class="grid2">${b.companies.map(cid => `<div class="card chart-card"><h3>${esc(cname(cid))} · ${esc(M[b.metric].name)}</h3>${metricChart(cid, b.metric)}</div>`).join("")}</div>`;
  }
  document.getElementById("pane-view").innerHTML = h;
}

// ---------- 행동 ----------
function showErr(key, msg) {
  for (const el of document.querySelectorAll("[data-err]")) if (el.dataset.err === key) el.textContent = msg ? " " + msg : "";
}
async function post(action, errKey) {
  showErr(errKey, "");
  try {
    const r = await fetch("/api/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(action)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { showErr(errKey, j.error || `기록하지 못했습니다 (${r.status}).`); return; }
    await reloadData();
  } catch (e) { showErr(errKey, "서버에 닿지 못했습니다. serve.py가 켜져 있는지 확인하세요."); }
}
function reloadData() {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "data.js?t=" + Date.now();
    s.onload = () => { s.remove(); loadData(); refresh(); res(); };
    s.onerror = () => { s.remove(); rej(new Error("data.js")); };
    document.body.appendChild(s);
  });
}
const UNIT_IN = {USD: ["억 달러", 1e8], "%": ["%", 1], MW: ["MW", 1]};
function openForm(card, kind) {
  const a = D.alerts.find(x => x.id === card.dataset.aid), slot = card.querySelector(".slot");
  if (slot.dataset.kind === kind) { slot.innerHTML = ""; slot.dataset.kind = ""; return; }
  slot.dataset.kind = kind;
  if (kind === "correct") {
    const [u, k] = UNIT_IN[M[a.metric]?.unit] || ["", 1];
    slot.innerHTML = `<form class="f" data-form="correct"><label>새 값 <input name="value" inputmode="decimal" size="10" placeholder="${esc(+(a.current.value / k).toFixed(4))}"> ${esc(u)}</label><input name="note" placeholder="정정 이유 (필수)"><button class="b">기록</button><span class="err" data-ferr></span></form>`;
  } else {
    const opts = D.companies.filter(c => c.id !== a.company).map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    slot.innerHTML = `<form class="f" data-form="link"><span>원문 표현 "${esc(a.current.label)}"은</span><select name="cp"><option value="">고르세요</option>${opts}<option value="__null">확인했지만 모름</option></select><input name="note" placeholder="이유 (필수)"><button class="b">기록</button><span class="err" data-ferr></span></form>`;
  }
  slot.querySelector("input,select").focus();
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go) return showTab(go.dataset.goto);
  const fc = e.target.closest("[data-focal]");
  if (fc) { setFocal(fc.dataset.focal); return; }
  const fg = e.target.closest("[data-focal-go]");
  if (fg) { setFocal(fg.dataset.focalGo); showTab("overview"); return; }
  const rel = e.target.closest("[data-rel]");
  if (rel) return showRelation(+rel.dataset.rel);
  const b = e.target.closest("button[data-act]");
  if (b && !b.disabled) {
    const card = b.closest(".al"), act = b.dataset.act;
    if (act === "panel") return showPanel(b.dataset.key);
    if (act === "review") {
      const [company, metric, period_end] = b.dataset.key.split("|");
      return post({type: "review", target: {company, metric, period_end}, note: ""}, card ? card.dataset.aid : b.dataset.key);
    }
    if (act === "dismiss") return post({type: "dismiss", target: {alert_id: card.dataset.aid}, note: ""}, card.dataset.aid);
    if (act === "open-correct") return openForm(card, "correct");
    if (act === "open-link") return openForm(card, "link");
  }
  const op = e.target.closest("[data-open]");
  if (op && !e.target.closest("form,a")) return showPanel(op.dataset.open);
});
document.addEventListener("submit", e => {
  const form = e.target.closest("form.f");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "decide" || form.dataset.form === "reflect") {
    const ferr = form.querySelector("[data-ferr]"), why = form.querySelector("[name=note]").value.trim(), key = form.dataset.key;
    if (!API) { ferr.textContent = OFF_MSG; return; }
    if (form.dataset.form === "reflect") {
      if (!why) { ferr.textContent = "돌아본 내용을 적으세요."; return; }
      return post({type: "reflect", target: {decision: key}, note: why}, key);
    }
    const decision = form.querySelector("[name=decision]").value.trim();
    if (!decision) { ferr.textContent = "하기로 한 것을 적으세요."; return; }
    if (!why) { ferr.textContent = "이유를 적으세요."; return; }
    return post({type: "decide", target: {thesis: key}, decision, note: why}, "decide|" + key);
  }
  if (form.dataset.form === "judge") {
    const ferr = form.querySelector("[data-ferr]"), verdict = form.querySelector("[name=verdict]").value, why = form.querySelector("[name=note]").value.trim();
    if (!API) { ferr.textContent = OFF_MSG; return; }
    if (!verdict) { ferr.textContent = "판정을 고르세요."; return; }
    if (!why) { ferr.textContent = "판정 이유를 적으세요."; return; }
    ferr.textContent = "";
    const [thesis, condition, period_end] = form.dataset.key.split("|");
    return post({type: "judge", target: {thesis, condition, period_end}, verdict, note: why}, form.dataset.key);
  }
  const card = form.closest(".al"), a = D.alerts.find(x => x.id === card.dataset.aid), ferr = form.querySelector("[data-ferr]");
  const note = form.querySelector("[name=note]").value.trim(), bad = (msg) => { ferr.textContent = msg; };
  if (!API) return bad(OFF_MSG);
  if (form.dataset.form === "correct") {
    const raw = form.querySelector("[name=value]").value.trim().replace(/,/g, "");
    if (!raw || !isFinite(Number(raw))) return bad("새 값을 숫자로 넣으세요.");
    if (!note) return bad("정정 이유를 적으세요.");
    const k = (UNIT_IN[M[a.metric]?.unit] || ["", 1])[1];
    const value = k === 1 ? Number(raw) : Math.round(Number(raw) * k);
    post({type: "correct", target: {company: a.company, metric: a.metric, period_end: a.period_end}, value, note}, a.id);
  } else {
    const cp = form.querySelector("[name=cp]").value;
    if (!cp) return bad("회사를 고르거나 확인했지만 모름을 고르세요.");
    if (!note) return bad("이유를 적으세요.");
    post({type: "link", target: {company: a.company, label: a.current.label}, counterparty: cp === "__null" ? null : cp, note}, a.id);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  const op = e.target.closest?.("[data-open]");
  if (op && op.tagName !== "BUTTON" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showPanel(op.dataset.open); }
});
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("dr-close").addEventListener("click", closeDrawer);

// ---------- 툴팁 ----------
const tip = document.getElementById("tip");
let tipEl = null;
document.addEventListener("mousemove", e => {
  const el = e.target.closest?.("[data-tip]");
  if (el !== tipEl) {
    if (tipEl?.dataset.xh) tipEl.closest("svg")?.querySelector(".xh")?.style.setProperty("visibility", "hidden");
    tipEl = el;
    if (el) {
      tip.innerHTML = el.dataset.tip.split("\n").map(l => l.startsWith("<b>") ? l : esc(l)).join("\n");
      if (el.dataset.xh) { const xh = el.closest("svg")?.querySelector(".xh"); if (xh) { xh.setAttribute("x1", el.dataset.xh); xh.setAttribute("x2", el.dataset.xh); xh.style.visibility = "visible"; } }
    }
    tip.style.opacity = el ? 1 : 0;
  }
  if (el) {
    const r = tip.getBoundingClientRect(), pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
});

// ---------- 탭 ----------
const tabs = document.getElementById("tabs");
let curTab = location.hash.slice(1) || (() => { try { return localStorage.getItem("tab") || "overview"; } catch (e) { return "overview"; } })();
const PANES = ["overview", "compare", "theses", "alerts", "log", "view"];
function renderTabs() {
  const n = D.alerts.filter(a => !a.dismissed).length;
  tabs.innerHTML = `<button data-id="overview">개요</button><button data-id="compare">비교</button><button data-id="theses">가설</button><button data-id="alerts">알림${n ? `<span class="n">${n}</span>` : ""}</button><button data-id="log">기록</button>` + (D.views || []).map(v => `<button data-id="${esc(v.id)}">${esc(v.title)}</button>`).join("");
}
function showTab(id) {
  if (!PANES.includes(id) && !(D.views || []).some(v => v.id === id)) id = "overview";
  curTab = id;
  try { localStorage.setItem("tab", id); } catch (e) {}
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  const pane = PANES.includes(id) && id !== "view" ? id : "view";
  for (const p of PANES) document.getElementById("pane-" + p).hidden = p !== pane;
  scrollTo(0, 0);
  if (pane === "overview") renderOverview();
  if (pane === "compare") renderCompare();
  if (pane === "theses") renderTheses();
  if (pane === "alerts") renderAlerts();
  if (pane === "log") renderLog();
  if (pane === "view") renderView(D.views.find(v => v.id === id));
  for (const b of tabs.children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
}
function setFocal(id) {
  focal = id;
  try { localStorage.setItem("focal", id); } catch (e) {}
  if (curTab === "overview") renderOverview();
}
function refresh() {
  document.getElementById("gen").textContent = `자료 ${D.generated}`;
  renderTabs();
  showTab(curTab);
  if (selected && document.getElementById("drawer").classList.contains("on")) showPanel(selected);
}
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.id); });
refresh();
fetch("/api/ping", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(j => { API = !!(j && j.ok); refresh(); }).catch(() => {});
</script>
